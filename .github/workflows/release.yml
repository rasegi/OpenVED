name: Release

# Builds the macOS DMG and Windows MSI and, on a version tag, publishes them as
# a GitHub Release. The build jobs reuse the same scripts that build locally
# (scripts/build-macos.sh, scripts/build-windows.ps1), so CI and local stay in
# sync.
#
#   - push a tag  v1.2.3   -> build both installers + create the release
#   - "Run workflow" button -> build both installers only (artifacts, no release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Pin the Qt version used on Windows (install-qt-action). macOS uses Homebrew Qt.
env:
  QT_VERSION: "6.9.3"

jobs:
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Homebrew Qt + FreeType/HarfBuzz)
        run: brew install qt freetype harfbuzz ninja

      - name: Build DMG
        run: ./scripts/build-macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/release/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (official, msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install FreeType + HarfBuzz (vcpkg, static triplet)
        shell: pwsh
        # Run from the vcpkg root (NOT the repo) so vcpkg stays in classic mode.
        # In the repo dir it would see vcpkg.json, switch to manifest mode and
        # reject the package arguments. build-windows.ps1 then consumes the
        # result via VcpkgRoot\installed\x64-windows-static (VCPKG_MANIFEST_MODE=OFF).
        run: |
          Set-Location $env:VCPKG_INSTALLATION_ROOT
          ./vcpkg install freetype harfbuzz --triplet x64-windows-static

      - name: Build MSI
        shell: pwsh
        run: |
          $vsRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path $vsRoot)) {
            $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -property installationPath
          }
          ./scripts/build-windows.ps1 `
            -QtDir "$env:QT_ROOT_DIR" `
            -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT" `
            -VsRoot "$vsRoot" `
            -Triplet "x64-windows-static"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: build/release-win/*.msi
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: a single self-contained AppImage that runs on any distro.
  build-linux:
    runs-on: ubuntu-22.04 # older glibc → the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (official, linux gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libfuse2

      - name: Configure + build (FreeType/HarfBuzz via FetchContent)
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux

      - name: Stage install tree into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build/linux --prefix /usr

      - name: Package AppImage (linuxdeploy + Qt plugin)
        run: |
          wget -qO linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -qO linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export APPIMAGE_EXTRACT_AND_RUN=1   # runners have no FUSE
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_PLUGINS="platforms;imageformats;styles"
          export LINUXDEPLOY_OUTPUT_VERSION="${GITHUB_REF_NAME}"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          # Normalise the output name.
          mv OpenVED*.AppImage "OpenVED-${GITHUB_REF_NAME}-x86_64.AppImage" 2>/dev/null || true
          ls -la *.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "*.AppImage"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # WebAssembly: build the browser bundle and publish it to GitHub Pages.
  # WASM needs Qt 6.11 (+ Emscripten 4.0.7) — see story_16 (Combobox fix).
  build-wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten 4.0.7 (matches Qt 6.11)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          host: all_os
          target: wasm
          arch: wasm_singlethread
          dir: ${{ github.workspace }}/qt
          cache: true

      - name: Install host Qt (moc/rcc, must match the wasm version)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ github.workspace }}/qt
          cache: true

      - name: Build WASM bundle
        run: |
          export QT_WASM="${{ github.workspace }}/qt/Qt/6.11.1/wasm_singlethread"
          export QT_HOST="${{ github.workspace }}/qt/Qt/6.11.1/gcc_64"
          ./scripts/build-wasm.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/wasm/dist

  # Publish the WASM bundle to GitHub Pages (needs Pages enabled in repo settings:
  # Settings → Pages → Source: "GitHub Actions").
  deploy-pages:
    needs: build-wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Only on a version tag: gather all installers into a GitHub Release.
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-dmg/*.dmg
            dist/windows-msi/*.msi
            dist/linux-appimage/*.AppImage
          # Tags containing a hyphen (v0.2.0-beta.1) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
